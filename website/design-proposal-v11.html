<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>科学边界 · 事件视界观测站</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2215%22%20fill%3D%22none%22%20stroke%3D%22%237dd3fc%22%20stroke-width%3D%221%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%237dd3fc%22%20stroke-width%3D%221.2%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%224.2%22%20fill%3D%22%2367e8f9%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%224.2%22%20fill%3D%22%23a5f3fc%22%20fill-opacity%3D%220.5%22%2F%3E%3C%2Fsvg%3E" />
<link rel="canonical" href="./" />
<meta http-equiv="refresh" content="0; url=./" />
<meta name="robots" content="noindex,follow" />
<style>
  html,body{height:100%;margin:0}
  body{
    background:#05070f;
    color:rgba(255,255,255,.78);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;box-sizing:border-box;
  }
  .wrap{max-width:420px}
  .ring{
    width:44px;height:44px;margin:0 auto 20px;border-radius:50%;
    border:2px solid rgba(150,170,255,.22);
    border-top-color:rgba(150,190,255,.85);
    animation:spin 900ms linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ring{animation:none;border-top-color:rgba(150,190,255,.85)}}
  h1{font-size:17px;font-weight:500;letter-spacing:.06em;margin:0 0 8px;color:rgba(255,255,255,.92)}
  p{font-size:13.5px;line-height:1.7;margin:0 0 20px;color:rgba(255,255,255,.55)}
  a.go{
    display:inline-block;padding:11px 22px;min-height:44px;box-sizing:border-box;
    border-radius:999px;text-decoration:none;font-size:14px;
    color:rgba(225,235,255,.95);
    border:1px solid rgba(150,170,255,.38);
    background:rgba(120,140,255,.10);
    transition:background 150ms ease,border-color 150ms ease;
  }
  a.go:hover{background:rgba(120,140,255,.20);border-color:rgba(160,180,255,.60)}
  a.go:focus-visible{outline:2px solid rgba(160,190,255,.9);outline-offset:3px}
</style>
</head>
<body>
  <div class="wrap" role="status" aria-live="polite">
    <div class="ring" aria-hidden="true"></div>
    <h1>星图已迁移至主页</h1>
    <p>「科学边界」主叙事现在就是站点首页。<br />若未自动跳转，请点击下方按钮。</p>
    <a class="go" href="./">进入星图 →</a>
  </div>
  <script>location.replace('./');</script>
</body>
</html>
