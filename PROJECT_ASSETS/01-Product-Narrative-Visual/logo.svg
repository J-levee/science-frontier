<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="科学边界 Science Frontier">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#15182b"/>
      <stop offset="100%" stop-color="#070810"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 深空底 -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>

  <!-- 边界环（科学边界） -->
  <circle cx="24" cy="22" r="15" fill="none" stroke="url(#ring)" stroke-width="1.6" opacity="0.9" filter="url(#glow)"/>

  <!-- 视界弧（地平线） -->
  <path d="M9 33 Q24 27 39 33" fill="none" stroke="url(#horizon)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 中心亮点（奇点 / 观察者） -->
  <circle cx="24" cy="22" r="2.4" fill="#e8e8f0" filter="url(#glow)"/>

  <!-- 星点 -->
  <g fill="#cdd3ff">
    <circle cx="13" cy="12" r="0.9"/>
    <circle cx="36" cy="14" r="0.7"/>
    <circle cx="34" cy="32" r="0.8"/>
    <circle cx="14" cy="36" r="0.6"/>
    <circle cx="40" cy="24" r="0.6"/>
    <circle cx="9" cy="24" r="0.5"/>
  </g>
</svg>
